
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anika 💌</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Georgia,serif;
 background:linear-gradient(135deg,#fce4ec,#e9dcff,#dcecff);
 color:#704b68;
 overflow-x:hidden;
 text-align:center;
}
body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 opacity:.35;
 background-image:
 radial-gradient(#fff 1px,transparent 1px);
 background-size:25px 25px;
}
h1{font-size:30px}
.subtitle{font-style:italic;color:#98728f}
.container{
 position:relative;
 z-index:2;
 max-width:600px;
 margin:auto;
 padding:25px 16px 50px;
}
.envelope-area{
 margin:55px auto 25px;
 width:270px;
 height:180px;
 position:relative;
 cursor:pointer;
 perspective:1000px;
}
.envelope{
 position:absolute;
 inset:0;
 background:#f5a9c4;
 border-radius:8px;
 box-shadow:0 12px 30px #a879a655;
}
.envelope:before{
 content:"";
 position:absolute;
 inset:0;
 background:#fbd2df;
 clip-path:polygon(0 0,50% 58%,100% 0);
 z-index:3;
 transform-origin:top;
 transition:transform 1s;
}
.envelope:after{
 content:"";
 position:absolute;
 inset:0;
 background:#ee91b4;
 clip-path:polygon(0 100%,50% 48%,100% 100%);
 z-index:4;
}
.seal{
 position:absolute;
 z-index:5;
 top:65px;
 left:111px;
 font-size:40px;
}
.open .envelope:before{
 transform:rotateX(180deg);
}
.bear{
 font-size:65px;
 margin:10px;
 animation:breathe 3s infinite ease-in-out;
}
@keyframes breathe{
 50%{transform:scale(1.06)}
}
.opening{
 animation:rise 1s forwards;
}
@keyframes rise{
 to{opacity:0;transform:translateY(-35px)}
}
button{
 border:none;
 padding:12px 19px;
 margin:7px;
 border-radius:25px;
 background:#d98db5;
 color:white;
 font-size:15px;
 cursor:pointer;
 box-shadow:0 4px 12px #9d6b9940;
}
button:active{transform:scale(.96)}
.letter{
 display:none;
 margin-top:30px;
 background:#fffafc;
 border:2px solid #f3c4d9;
 border-radius:17px;
 padding:25px 20px;
 box-shadow:0 12px 35px #8d668a25;
 min-height:420px;
}
.letter.show{display:block}
.page{
 min-height:290px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 animation:fade .5s;
}
@keyframes fade{
 from{opacity:0;transform:translateY(8px)}
 to{opacity:1;transform:translateY(0)}
}
.page h2{color:#bd729b;font-size:23px}
.page p{
 font-size:17px;
 line-height:1.9;
 white-space:pre-line;
}
.page-number{
 color:#bb8ca9;
 font-size:13px;
 margin-top:15px;
}
.progress{
 height:6px;
 background:#f4dce9;
 border-radius:10px;
 margin:15px 0;
 overflow:hidden;
}
.bar{
 height:100%;
 width:2%;
 background:#ce8bb3;
 transition:width .3s;
}
.flowers{
 position:fixed;
 pointer-events:none;
 z-index:1;
 animation:fall linear forwards;
}
@keyframes fall{
 from{transform:translateY(-30px) rotate(0)}
 to{transform:translateY(110vh) rotate(360deg)}
}
.hidden{display:none}
.footer{
 font-size:13px;
 margin-top:30px;
 color:#a47c9a;
}
</style>
</head>

<body>

<div class="container">

<h1>For Anika 🌸</h1>
<p class="subtitle">A little letter from someone who is genuinely sorry.</p>

<div id="intro">
 <div class="bear">🧸</div>
 <p>Someone has a little something to tell you...</p>

 <div class="envelope-area" id="env" onclick="openLetter()">
  <div class="envelope"></div>
  <div class="seal">💌</div>
 </div>

 <button onclick="openLetter()">Open your letter 🌷</button>
 <p class="subtitle">Made with sincerity, not excuses.</p>
</div>

<audio id="music" src="song.mp3" loop></audio>

<div class="letter" id="letter">
 <div class="bear">🧸🌸</div>
 <h2>Dear Anika,</h2>
 <p class="subtitle">50 little pages, one genuine apology.</p>

 <div class="progress">
  <div class="bar" id="bar"></div>
 </div>

 <div class="page" id="page"></div>

 <div class="page-number" id="number"></div>

 <div>
  <button onclick="previous()">← Previous</button>
  <button onclick="next()">Next →</button>
 </div>

 <button onclick="toggleMusic()" id="musicBtn">🎵 Pause music</button>

 <p class="footer">A little universe of apologies, sakura and friendship. 🌸</p>
</div>

</div>

<script>
const pages = [

["01 — Before anything else",
"Anika, before you read anything else, I want to say one thing. I'm genuinely sorry. I forgot your birthday, and I know that it hurt you. I am not writing this to make the mistake look smaller. I am writing because you deserve a proper apology."],

["02 — Your special day",
"Your birthday was supposed to be a day when you felt remembered, appreciated and celebrated. You deserved that from the people who matter to you. I am sorry that I failed to remember it."],

["03 — No excuses",
"I could give you explanations, talk about how busy I was or say that it slipped my mind. But none of those things changes how you felt. An explanation cannot erase disappointment."],

["04 — I understand",
"I understand that forgetting a birthday can feel like being forgotten as a person. Maybe that is what hurt the most. I cannot decide how you should feel about it. Your feelings are valid."],

["05 — A genuine sorry",
"I'm really sorry, Anika. Not a casual sorry to finish an argument, not a sorry because you are upset, but a sincere apology because I recognise that I hurt someone I value."],

["06 — You deserved better",
"You deserved a birthday wish without having to wait for it. You deserved to know that someone remembered your day without needing a reminder. I wish I had done that."],

["07 — No comparison",
"I won't compare my mistake with other things or try to convince you that it wasn't a big deal. It mattered to you, and that is enough reason for me to take it seriously."],

["08 — Our friendship",
"I value the friendship we share. I don't want one mistake to become the only thing that defines how I see you or the respect I have for you."],

["09 — Your feelings matter",
"You don't have to pretend everything is fine just because I apologised. If you're hurt, you're allowed to be hurt. I don't want you to hide that just to make things easier for me."],

["10 — Listening",
"Anika, I want to listen to you properly. I remember wanting these exact words to be part of my apology: I'll always listen to you. I mean that."],

["11 — Not just words",
"I know that a beautiful letter cannot automatically rebuild trust. Words are easy to write. What matters is whether I become more thoughtful through my actions."],

["12 — The missed wish",
"I wish I had been there with a birthday wish on the right day. I wish I had made you smile instead of giving you a reason to feel disappointed."],

["13 — No pressure",
"I am not asking you to forgive me immediately. You don't owe me an instant reply, a smile or a promise that everything is okay."],

["14 — Your importance",
"Your importance isn't measured by whether I remembered a date correctly. But I understand that remembering that date was one way of showing that importance, and I failed at it."],

["15 — The honest truth",
"I made a mistake. I won't deny it, decorate it or blame someone else for it. I should have remembered, and I didn't."],

["16 — A little bear",
"Look at this little bear sitting here with a flower. 🧸🌸 He has no clever excuse to offer. Just a tiny flower and a very sincere apology."],

["17 — The Japanese garden",
"Imagine a quiet Japanese garden, cherry blossoms falling slowly and a little letter resting beneath a tree. This is the peaceful feeling I wanted this letter to carry, even though its message begins with an apology."],

["18 — Sakura petals",
"Cherry blossoms remind us that beautiful moments deserve to be noticed. Your birthday was one of those moments, and I am sorry I let it pass without acknowledging it."],

["19 — A friendship worth respecting",
"I don't want to take your friendship for granted. If someone matters to us, we should make an effort to show it, not simply assume that they already know."],

["20 — I should have remembered",
"I should have marked the date, remembered it and wished you properly. That responsibility was mine. I am sorry I didn't fulfil it."],

["21 — No emotional pressure",
"Please don't feel that you have to forgive me because I made fifty pages. I made them because I wanted to put genuine effort into expressing what I couldn't express properly in a short message."],

["22 — Your anger",
"If you're angry, I understand. I won't call your anger unnecessary or tell you that you're overreacting. You have your own feelings and I respect them."],

["23 — A better friend",
"I want to become a more attentive friend. Not someone who remembers only when reminded, but someone who makes a conscious effort to remember the little things."],

["24 — The little things",
"Sometimes the smallest gestures carry the biggest meaning. A birthday wish may look like a small message to someone else, but it can mean a lot to the person receiving it."],

["25 — I am listening",
"If you want to tell me how much this hurt you, I will listen without interrupting you with excuses. You deserve to be heard."],

["26 — A quiet promise",
"I cannot promise that I will never make another mistake. But I can promise to take responsibility, learn from this and put more care into remembering important moments."],

["27 — The stars",
"Imagine a sky filled with little stars, each one carrying a small wish for you. I hope the coming days bring you peace, happiness, good opportunities and plenty of reasons to smile."],

["28 — Your birthday still matters",
"Even though I missed the day, I don't want your birthday to go uncelebrated in my words. You deserve good wishes, not just an apology."],

["29 — Belated wishes",
"Happy belated birthday, Anika! 🌷 I hope your year ahead brings you beautiful experiences, meaningful friendships, strength during difficult days and happiness in unexpected places."],

["30 — A fresh page",
"Every page in this letter is another attempt to say something honestly. Not to change the past, but to show that I am willing to acknowledge it and do better."],

["31 — The fireworks",
"Imagine little fireworks lighting up the Japanese night sky. 🎆 Not because everything is suddenly perfect, but because you deserve to have beautiful moments worth celebrating."],

["32 — Friendship isn't ownership",
"I value our friendship, but I also respect your space. You are free to feel however you feel, and I won't make you responsible for making me feel better about my mistake."],

["33 — A little honesty",
"I felt that a simple sorry might not express how genuinely I regret forgetting your birthday. That is why I wanted to make something with effort behind it."],

["34 — No forgotten feelings",
"I hope you never feel that your feelings are unimportant in a friendship. They matter, and I should have been more thoughtful about something that was important to you."],

["35 — Learning",
"I want to take this as a reminder to be more present, more observant and more responsible with the moments that matter to the people around me."],

["36 — Not a transaction",
"This letter is not a trade. Fifty pages do not cancel one forgotten birthday. I don't expect you to exchange forgiveness for the effort I put into making it."],

["37 — A little flower",
"If I could place one flower in your hands today, it would simply carry these words: I'm sorry, Anika. You deserved to be remembered."],

["38 — Your happiness",
"I hope you had moments on your birthday that made you genuinely happy. I hope you were surrounded by kindness, laughter and people who made you feel special."],

["39 — What I regret",
"I regret not remembering the date. More than that, I regret that my forgetfulness became a reason for you to feel hurt. I wish I had been more careful."],

["40 — A sincere effort",
"I want my future actions to say what this letter is trying to say. I want to become someone who pays attention, remembers and shows care consistently."],

["41 — Time",
"Take your time, Anika. I won't rush you into accepting this apology. Some feelings need time, and I respect that."],

["42 — Thank you",
"Thank you for the friendship and the moments we have shared. I don't want to treat those things casually. They deserve appreciation."],

["43 — A little moon",
"Under a quiet moon and falling sakura petals, this little bear is still holding the same flower. It hasn't changed its message: I am genuinely sorry."],

["44 — What I want you to know",
"I hope you know that I never intended to make you feel unimportant. But I also understand that good intentions don't automatically remove the hurt caused by my actions."],

["45 — A new habit",
"I will make a better effort to remember important dates and moments. I don't want to rely on last-minute apologies when I could have shown care beforehand."],

["46 — Your choice",
"Whether you need time, want to talk or simply want some space, I will respect that. I am not going to dictate how this friendship should move forward."],

["47 — One last apology",
"Anika, I am really sorry. I wish I could go back and send that birthday wish on time. Since I cannot, I can at least be honest, accept my mistake and learn from it."],

["48 — The birthday wish",
"May your days be filled with gentle mornings, peaceful nights, wonderful achievements, good health, laughter and people who remember to celebrate you."],

["49 — From my side",
"I hope this letter communicates what I wanted it to: you deserved to be remembered, your disappointment matters, and I am sincerely sorry for forgetting your birthday."],

["50 — The final page",
"Dear Anika,\n\nI'm really sorry, and I'll always listen to you.\n\nHappy belated birthday once again. 🌸\n\nThank you for being part of my life. I will not ask you to forget what happened. I only hope that, with time and consistent actions, I can show you that I have learned from it.\n\nWith sincerity,\nYour friend 💌\n\nP.S. This little bear is leaving one last flower for you. 🧸🌷"]
];

let current=0;
let opened=false;

function render(){
 const p=pages[current];
 document.getElementById("page").innerHTML=
  `<h2>${p[0]}</h2><p>${p[1]}</p>`;
 document.getElementById("number").innerText=
  `Page ${current+1} of 50`;
 document.getElementById("bar").style.width=
  ((current+1)/50*100)+"%";
}

function openLetter(){
 if(opened)return;
 opened=true;
 document.getElementById("env").classList.add("open");
 document.getElementById("intro").classList.add("opening");

 const music=document.getElementById("music");
 music.volume=0.55;
 music.play().catch(()=>{});

 setTimeout(()=>{
  document.getElementById("intro").classList.add("hidden");
  document.getElementById("letter").classList.add("show");
  render();
 },900);
}

function next(){
 if(current<49){
  current++;
  render();
 }else{
  document.getElementById("page").innerHTML=
   "<h2>Thank you for reading 🌸</h2><p>Sending you one final sakura flower. 🧸💗</p>";
 }
}

function previous(){
 if(current>0){
  current--;
  render();
 }
}

function toggleMusic(){
 const m=document.getElementById("music");
 if(m.paused){
  m.play();
  document.getElementById("musicBtn").innerText="🎵 Pause music";
 }else{
  m.pause();
  document.getElementById("musicBtn").innerText="🎵 Play music";
 }
}

// Falling sakura petals
function petal(){
 const f=document.createElement("div");
 f.className="flowers";
 f.innerText=["🌸","🌷","✨","💮"][Math.floor(Math.random()*4)];
 f.style.left=Math.random()*100+"vw";
 f.style.fontSize=(14+Math.random()*15)+"px";
 f.style.animationDuration=(6+Math.random()*7)+"s";
 document.body.appendChild(f);
 setTimeout(()=>f.remove(),14000);
}
setInterval(petal,700);
</script>
</body>
</html>
